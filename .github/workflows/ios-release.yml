# iOS release. A tag `ios/v1.2.3` builds the store app, sends it to TestFlight
# and makes a GitHub release. See docs/RELEASE.md for the secrets.
name: iOS release

on:
  push:
    tags: ['ios/v*']

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7bae1d00b5db9166f4f0fc47985a3a5702cb58f0 # v1.227.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iosApp
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Find the version
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#ios/v}" >> "$GITHUB_ENV"
          # The build number must increase with each upload to App Store Connect.
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Set the API address
        if: vars.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # In an xcconfig file, `//` starts a comment. `$()` keeps the two slashes.
          echo "PG_API_BASE_URL = ${API_BASE_URL/\/\//\/\$()\/}" > iosApp/Config/Local.xcconfig

      - name: Install the certificate and the profiles
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_REPORT: ${{ secrets.IOS_PROFILE_REPORT_BASE64 }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          [ -n "$PROFILE_APP" ] && [ -n "$PROFILE_REPORT" ] || { echo "::error::The profile secrets are not set. See docs/RELEASE.md."; exit 1; }
          mkdir -p .secrets "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$CERTIFICATE" | base64 -d > .secrets/certificate.p12
          echo "$ASC_KEY" | base64 -d > .secrets/asc-key.p8
          for p in "$PROFILE_APP" "$PROFILE_REPORT"; do
            echo "$p" | base64 -d > .secrets/profile.mobileprovision
            uuid=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i .secrets/profile.mobileprovision)")
            cp .secrets/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          done
          security create-keychain -p "" phonegolf-build.keychain
          security list-keychains -d user -s phonegolf-build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "" phonegolf-build.keychain
          security set-keychain-settings -t 3600 -u phonegolf-build.keychain
          security import .secrets/certificate.p12 -k phonegolf-build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" phonegolf-build.keychain

      - name: Read the release notes
        run: |
          awk "/^## \[${VERSION_NAME}\]/{flag=1; next} /^## \[/{flag=0} flag" iosApp/CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > /tmp/notes.md
          {
            echo "RELEASE_NOTES<<NOTES_END"
            cat /tmp/notes.md
            echo "NOTES_END"
          } >> "$GITHUB_ENV"

      - name: Build and send to TestFlight
        run: cd iosApp && bundle exec fastlane deploy_testflight

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "iOS v$VERSION_NAME" --notes-file /tmp/notes.md

      - name: Remove the secrets
        if: always()
        run: |
          rm -rf .secrets iosApp/Config/Local.xcconfig
          security delete-keychain phonegolf-build.keychain || true
