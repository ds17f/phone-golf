# Android release. A tag `android/v1.2.3` builds the signed bundle, makes a
# GitHub release and sends the bundle to the internal test track of Google
# Play. See docs/RELEASE.md for the secrets.
name: Android release

on:
  push:
    tags: ['android/v*']

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://phonegolf.makersundays.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ruby/setup-ruby@7bae1d00b5db9166f4f0fc47985a3a5702cb58f0 # v1.227.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: androidApp

      - name: Find the version
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#android/v}" >> "$GITHUB_ENV"
          # The version code must increase with each upload to Google Play.
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Write the secrets to files
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_JSON_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::The secret ANDROID_KEYSTORE_BASE64 is not set."; exit 1; }
          mkdir -p .secrets
          echo "$KEYSTORE" | base64 -d > .secrets/release.jks
          {
            echo "storeFile=.secrets/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > .secrets/keystore.properties
          echo "$PLAY_JSON" | base64 -d > .secrets/play-store.json

      - name: Build the signed bundle and APK
        run: |
          cd androidApp
          ./gradlew bundleRelease assembleRelease \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            -PapiBaseUrl="$API_BASE_URL"

      - name: Read the release notes
        run: |
          awk "/^## \[${VERSION_NAME}\]/{flag=1; next} /^## \[/{flag=0} flag" androidApp/CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > /tmp/notes.md
          {
            echo "RELEASE_NOTES<<NOTES_END"
            cat /tmp/notes.md
            echo "NOTES_END"
          } >> "$GITHUB_ENV"

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/app/build/outputs/apk/release/app-release.apk "phone-golf-$VERSION_NAME.apk"
          gh release create "$GITHUB_REF_NAME" --title "Android v$VERSION_NAME" \
            --notes-file /tmp/notes.md "phone-golf-$VERSION_NAME.apk" \
            androidApp/app/build/outputs/bundle/release/app-release.aab

      - name: Send the bundle to Google Play (internal test)
        env:
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: |
          cd androidApp
          bundle exec fastlane upload_internal aab:"$GITHUB_WORKSPACE/androidApp/app/build/outputs/bundle/release/app-release.aab"

      - name: Remove the secrets
        if: always()
        run: rm -rf .secrets
