# Checks for each pull request and each push to main: the API tests, the
# Android build and tests, and the iOS simulator build.
#
# Runners: each job uses a GitHub runner by default. To use your own runner,
# set the repository variable LINUX_RUNNER or MACOS_RUNNER to its label. A pull
# request from a fork always uses a GitHub runner, because code from a fork
# must not run on your own computer.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: make api-install
      - run: make api-typecheck
      - run: make api-test

  android:
    name: Android build and tests
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: make android-test
      - run: make android-build
      - name: Upload the debug app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-golf-debug-apk
          path: androidApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'macos-26') || vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build
        run: make ios-build
      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: iosApp/build/xcodebuild.log
          retention-days: 7
